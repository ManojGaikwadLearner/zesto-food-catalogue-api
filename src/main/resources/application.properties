spring.application.name=food-catalogue

server.port = 9092

## Active Profile
spring.profiles.active=dev

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/zesto_food_catalogue
spring.datasource.username=zestouser
spring.datasource.password=zesto@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

## Debugging
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
logging.level.org.springframework.web=DEBUG

